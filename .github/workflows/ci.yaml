name: Build, test, and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/friedcheese2006/pi-keepalived

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: make lint

      - name: Build and test
        run: make test

      - name: Scan image
        run: make scan

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image
        shell: bash
        run: |
          tags="${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF_NAME#v}"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true