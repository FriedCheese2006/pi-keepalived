name: "pihole-${NODE_NAME:-node}"

services:
  pihole:
    image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    hostname: "${NODE_NAME:?set NODE_NAME}"
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD}"
    volumes:
      - pihole-data:/etc/pihole
    networks:
      lan:
        ipv4_address: "${PIHOLE_ADDRESS:?set PIHOLE_ADDRESS}"
    healthcheck:
      test: ["CMD-SHELL", "dig +time=1 +tries=1 +short @127.0.0.1 pi.hole A | grep -qE '^[0-9]+(\\.[0-9]+){3}$'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  keepalived:
    image: ghcr.io/friedcheese2006/pi-keepalived:1.0.0
    network_mode: "service:pihole"
    depends_on:
      pihole:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    read_only: true
    tmpfs:
      - /run/keepalived:rw,noexec,nosuid,nodev,mode=0755
    stop_grace_period: 10s
    environment:
      VRRP_INTERFACE: "${VRRP_INTERFACE:-eth0}"
      VRRP_VIRTUAL_ROUTER_ID: "${VRRP_VIRTUAL_ROUTER_ID:-51}"
      VRRP_INSTANCE_NAME: "VI_DNS"
      VRRP_STATE: "BACKUP"
      VRRP_PRIORITY: "${VRRP_PRIORITY:?set VRRP_PRIORITY}"
      VRRP_VIRTUAL_IP: "${VRRP_VIRTUAL_IP:?set VRRP_VIRTUAL_IP}"
      VRRP_UNICAST_SRC_IP: "${PIHOLE_ADDRESS:?set PIHOLE_ADDRESS}"
      VRRP_UNICAST_PEERS: "${VRRP_UNICAST_PEER:?set VRRP_UNICAST_PEER}"
      VRRP_PREEMPT: "true"
      HEALTHCHECK_ENABLED: "true"
      HEALTHCHECK_DNS_SERVER: "127.0.0.1"
      HEALTHCHECK_DNS_PORT: "53"
      HEALTHCHECK_DNS_NAME: "pi.hole"
      HEALTHCHECK_INTERVAL: "2"
      HEALTHCHECK_TIMEOUT: "1"
      HEALTHCHECK_RISE: "2"
      HEALTHCHECK_FALL: "2"

volumes:
  pihole-data:

networks:
  lan:
    name: "${PIHOLE_NETWORK:-pihole_lan}"
    external: true